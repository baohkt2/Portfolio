name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-22.04
    outputs:
      image: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}, ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Deploy to server
    runs-on: ubuntu-22.04
    needs: build_and_push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH || '/home/ubuntu/party-game/' }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/home/ubuntu/party-game/"
            fi

            cd "$DEPLOY_PATH"

            # Login GHCR bằng PAT (server cần để pull image private)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Gắn đúng image SHA để tránh dùng nhầm cache :latest
            export APP_IMAGE="${{ needs.build_and_push.outputs.image }}:${{ github.sha }}"

            docker compose pull app
            docker compose up -d --no-build --remove-orphans
            docker image prune -f

            echo "✅ Deploy thành công: $APP_IMAGE"

  test_deployment:
    name: Run tests on deployed domain
    runs-on: ubuntu-22.04
    needs: deploy
    steps:
      - name: Check website status
        run: |
          echo "Waiting for service to be fully up..."
          sleep 10
          echo "Testing http://nguyehoaibao.io.vn/"
          curl -f --retry 5 --retry-delay 5 http://nguyehoaibao.io.vn/
          echo "✅ Tests passed successfully on http://nguyehoaibao.io.vn/"
